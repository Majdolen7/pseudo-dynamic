<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>From Ebla to Modern Syria: A Digital Timeline of Syrian Civilizations</title>
  <style>
    :root {
      --papyrus: #fdf6e3;
      --lapis: #4b6a74;
      --hematite: #8b5c4a;
      --sandstone: #d9c9a3;
      --desert-shadow: rgba(0, 0, 0, 0.06);
      --ink: #2f2f2f;
      --gray: #666;
    }

    body {
      font-family: Georgia, serif;
      background-color: var(--papyrus);
      color: var(--ink);
      margin: 0;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.5rem;
      font-size: 2rem;
      color: var(--lapis);
      border-bottom: 2px solid var(--sandstone);
      padding-bottom: 0.5rem;
      letter-spacing: 0.03em;
    }

    .intro {
      max-width: 850px;
      margin: 0 auto 2rem auto;
      text-align: center;
      color: var(--gray);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.8rem;
    }

    .card {
      background-color: #fcfaf5;
      border: 1px solid var(--sandstone);
      border-radius: 8px;
      box-shadow: 0 2px 6px var(--desert-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card img {
      width: 100%;
      height: 170px;
      object-fit: contain;
      background-color: #f1ead8;
      display: block;
      border-bottom: 1px solid var(--sandstone);
      padding: 0.6rem;
      box-sizing: border-box;
    }

    .card-content {
      padding: 1rem;
      background-color: #fffef9;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: bold;
      margin-bottom: 0.4rem;
      color: var(--hematite);
    }

    .meta {
      font-size: 0.8rem;
      color: var(--lapis);
      margin-bottom: 0.8rem;
      line-height: 1.5;
    }

    .card-description {
      font-size: 0.82rem;
      color: var(--gray);
      line-height: 1.55;
    }

    .arabic {
      direction: rtl;
      text-align: right;
      font-family: Georgia, "Times New Roman", serif;
      margin-top: 0.8rem;
      color: var(--ink);
    }

    .source {
      margin-top: 0.8rem;
      font-size: 0.72rem;
      color: var(--gray);
      border-top: 1px solid var(--sandstone);
      padding-top: 0.5rem;
    }
  </style>
</head>

<body>
  <h1>From Ebla to Modern Syria: A Digital Timeline of Syrian Civilizations</h1>

  <div class="gallery" id="gallery"></div>

  <script>
    const endpoint = "https://opensheet.elk.sh/1h3Xr9eCs3HI6HT0EuIqvUv76gRsaRfOXYvS4L21rBqU/Sheet1";

    const fallbackImage = "https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Syria_%28orthographic_projection%29.svg/640px-Syria_%28orthographic_projection%29.svg.png";

    fetch(endpoint)
      .then(response => response.json())
      .then(data => {
        const gallery = document.getElementById("gallery");

        data.forEach(item => {
          const card = document.createElement("div");
          card.className = "card";

          const image = item.image_url || fallbackImage;

          card.innerHTML = `
            <img src="${image}" alt="${item.name_en}">
            <div class="card-content">
              <div class="card-title">${item.name_ar} / ${item.name_en}</div>

              <div class="meta">
                <strong>${item.display_period}</strong><br>
                ${item.region}<br>
                ${item.capital_or_main_site} · ${item.type}
              </div>

              <div class="card-description">
                ${item.short_description_en}

                <div class="arabic">
                  ${item.short_description_ar}
                </div>

                <div class="source">
                  Source: ${item.source}
                </div>
              </div>
            </div>
          `;

          gallery.appendChild(card);
        });
      })
      .catch(error => {
        console.error("Error fetching data:", error);
        document.getElementById("gallery").innerHTML =
          "<p>Data could not be loaded. Please check the Google Sheet sharing settings or the OpenSheet endpoint.</p>";
      });
  </script>
</body>
</html>
